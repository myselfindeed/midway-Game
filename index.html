<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a1628">
  <title>中途岛：小宝特工空战 · Demo</title>
  <link rel="stylesheet" href="css/v3.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" class="hud hidden">
      <div class="hud-top">
        <div class="hud-block">
          <span class="label">装甲</span>
          <div class="bar"><i id="hpFill"></i></div>
        </div>
        <div class="hud-mission">
          <div class="hud-status">
            <span class="status-chip">护盾</span>
            <span id="flightTime">00:00</span>
            <span class="status-chip">能量</span>
          </div>
          <div id="missionText">击落敌机 0/6</div>
          <div id="phaseText">阶段 A · 侦察护航</div>
        </div>
        <div class="hud-tools">
          <button id="btnMute" class="btn-icon" type="button" aria-pressed="false" aria-label="关闭声音">声音</button>
          <button id="btnPause" class="btn-icon" type="button" aria-label="暂停">Ⅱ</button>
        </div>
      </div>

      <div id="aimFrame" class="aim-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="aimDir" class="aim-dir hidden" aria-hidden="true">敌机</div>
      <div id="lockHint" class="lock-hint hidden">瞄准</div>
      <div id="subtitle" class="subtitle hidden"></div>

      <div class="hud-bottom">
        <div id="joystick" class="joystick" aria-label="虚拟摇杆">
          <div id="stick" class="stick"></div>
        </div>
        <div class="action-pad">
          <button id="btnShield" class="btn-action shield" type="button">护盾</button>
          <button id="btnMissile" class="btn-action missile" type="button" aria-label="地狱火导弹">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 3c1.6 5 2.4 9 2.4 14.2L36 23l-9.2 2.2.2 8.2L24 44l-3-10.6.2-8.2L12 23l9.6-5.8C21.6 12 22.4 8 24 3z"/></svg>
          </button>
          <button id="btnBoost" class="btn-action boost" type="button">加速</button>
          <button id="btnFire" class="btn-action fire" type="button" aria-label="机关枪">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M4 25h7v-5l5-2v12l-5-2v-3H8l-4 7H2V25z"/><path fill="currentColor" d="M24 20h16v3H24zm2-6h12v3H26zm2 12h12v3H28z"/></svg>
          </button>
        </div>
      </div>

      <div class="cd-row">
        <span id="cdMissile">导弹就绪</span>
        <span id="cdShield">护盾就绪</span>
      </div>
      <div class="flight-readout">
        <div><b id="speedReadout">0</b><span>速度</span></div>
        <div><b id="altReadout">0</b><span>高度</span></div>
      </div>
    </div>

    <div id="overlay" class="overlay">
      <div class="panel">
        <p class="eyebrow">DEMO · 关卡 1–5</p>
        <h1>中途岛：小宝特工空战</h1>
        <p class="lead">云上的眼睛 · 轻量 3D 飞行射击原型</p>
        <button id="btnStart" class="btn-primary" type="button">选择关卡</button>
        <p class="hint">左手摇杆转向 · 右手按住射击 / 加速 · 横屏体验更佳<br>键鼠：WASD/方向键 · 空格射击 · Shift加速 · E导弹 · Q护盾</p>
      </div>
    </div>

    <!-- 模块加载失败兜底：ES Module + importmap 依赖相对路径的 vendor/js，
         直接双击 HTML 或用"单文件预览"打开时这些模块会 404，整页就黑屏。
         正常通过本地服务器访问时，8 秒内会设置 window.__appReady，此遮罩不出现。 -->
    <div id="bootFail" class="overlay hidden">
      <div class="panel">
        <p class="eyebrow">资源加载失败</p>
        <h1>游戏未能启动</h1>
        <p class="lead">请通过本地服务器访问游戏，不要直接双击 HTML 文件。<br>例如启动服务器后打开：<br><b>http://127.0.0.1:8901/index.html</b></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/v3/main.js"></script>
  <script>
    // 兜底：模块加载失败时给提示，而不是黑屏。
    // 注意——大模型（f16.glb 5M + carrier.glb 7M）首次从远端下载可能要 10s+，
    // 所以不能"8 秒没启动就判失败"。这里 8 秒后才开始轮询，最长等到 30 秒：
    // 启动成功（__appReady）即什么都不做；真失败（模块 404）才弹提示。
    (function () {
      var deadline = Date.now() + 30000;
      function check() {
        if (window.__appReady) return;      // 已启动成功，静默
        if (Date.now() >= deadline) {
          var el = document.getElementById('bootFail');
          if (el) el.classList.remove('hidden');
          return;
        }
        setTimeout(check, 1500);
      }
      setTimeout(check, 8000);
    })();
  </script>
</body>
</html>

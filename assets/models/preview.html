<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>MF-24 preview</title>
  <style>html,body,canvas{margin:0;height:100%;background:#6eb7ff;overflow:hidden}</style>
  <script type="importmap">
  { "imports": { "three": "../../vendor/three/build/three.module.js" } }
  </script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/three/examples/jsm/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6eb7ff);
scene.add(new THREE.HemisphereLight(0xd7ecff, 0x1a3040, 1.15));
const sun = new THREE.DirectionalLight(0xfff2d6, 1.45);
sun.position.set(30, 90, 40);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xa8c8ff, 0.4);
fill.position.set(-40, 30, -20);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 200);
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'chase';

const loader = new GLTFLoader();
loader.load('./fighter.glb?v=2', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const views = {
    chase: () => camera.position.set(center.x, center.y + size.y * 0.9, center.z + size.z * 1.15),
    rear: () => camera.position.set(center.x, center.y + 0.15, center.z + size.z * 0.85),
    top: () => camera.position.set(center.x, center.y + size.z * 1.35, center.z + 0.01),
    side: () => camera.position.set(center.x + size.z * 1.15, center.y + 0.4, center.z),
    front: () => camera.position.set(center.x, center.y + 0.35, center.z - size.z * 1.05),
    quarter: () => camera.position.set(center.x + size.x * 0.9, center.y + size.y * 0.8, center.z - size.z * 0.75),
  };
  (views[view] || views.chase)();
  camera.lookAt(center.x, center.y + 0.05, center.z);
  camera.updateProjectionMatrix();
  const side = q.get('side') === 'double' ? THREE.DoubleSide : THREE.FrontSide;
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = [].concat(o.material);
    mats.forEach((m) => { m.side = side; m.needsUpdate = true; });
  });
  function frame() { renderer.render(scene, camera); requestAnimationFrame(frame); }
  frame();
  window.__ready = true;
  window.__tris = 0;
  model.traverse((o) => {
    if (o.isMesh) window.__tris += o.geometry.index ? o.geometry.index.count / 3 : 0;
  });
});
</script>
</body>
</html>
